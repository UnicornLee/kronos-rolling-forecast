name: update forecast

# 每天跑一次预测 → 重建 series.json → 推到 main，GitHub Pages 自动更新
#
# 需要一个 self-hosted runner，跑在能连到 Mac 的机器上：
#   Runner 放在哪：仓库 Settings → Actions → Runners → New self-hosted runner
#   label 用 self-hosted 即可（下面 runs-on 就是它）
#
# 需要的 Secrets（Settings → Secrets and variables → Actions）：
#   MAC_SSH_KEY     Mac 免密登录私钥（对应 Mac 上 ~/.ssh/authorized_keys）
#   MAC_HOST        Mac 的 SSH 地址，如 100.68.2.86（Tailscale）或局域网 IP
#   MAC_USER        Mac 用户名，如 unicorn
#   MAC_REMOTE_BASE 预测目录，默认 /Volumes/ssd990pro1t/kronos/forecast
#   KRONOS_PY       Mac 上的 python 绝对路径，如 /Volumes/ssd990pro1t/kronos/native-venv/bin/python

on:
  schedule:
    # UTC 17:10 = 北京 01:10，日线 00:00 收盘后跑
    - cron: "10 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 准备 SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.MAC_SSH_KEY }}" > ~/.ssh/id_kronos
          chmod 600 ~/.ssh/id_kronos
          ssh-keyscan -H "${{ secrets.MAC_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Mac 上跑预测
        shell: bash
        env:
          HOST: ${{ secrets.MAC_HOST }}
          USER_: ${{ secrets.MAC_USER }}
          BASE: ${{ secrets.MAC_REMOTE_BASE }}
          PY: ${{ secrets.KRONOS_PY }}
        run: |
          : "${BASE:=/Volumes/ssd990pro1t/kronos/forecast}"
          : "${PY:=/Volumes/ssd990pro1t/kronos/native-venv/bin/python}"
          ssh -i ~/.ssh/id_kronos -o StrictHostKeyChecking=no "${USER_}@${HOST}" bash -s <<EOF
          set -euo pipefail
          cd "$BASE/scripts"
          KRONOS_H=3 "$PY" forecast_compare.py
          D="$BASE/history/run_\$(date +%Y%m%d_%H%M)"
          mkdir -p "\$D"
          cp "$BASE/out_compare/"*.json "\$D"/
          echo "ARCHIVE=\$D"
          EOF

      - name: 拉数据并重建
        shell: pwsh
        env:
          MAC_HOST: ${{ secrets.MAC_HOST }}
          MAC_USER: ${{ secrets.MAC_USER }}
          MAC_REMOTE_BASE: ${{ secrets.MAC_REMOTE_BASE }}
        run: |
          $env:MAC_HOST = "$env:MAC_USER@$env:MAC_HOST"
          # 借用同一把 key
          $key = Join-Path $env:USERPROFILE ".ssh\id_kronos"
          if (Test-Path $key) {
            $cfg = Join-Path $env:USERPROFILE ".ssh\config"
            "Host mac`n  HostName $env:MAC_HOST`n  User $env:MAC_USER`n  IdentityFile $key`n  StrictHostKeyChecking no" |
              Set-Content -Path $cfg -Encoding utf8
            .\scripts\sync.ps1 -MacHost mac
          } else {
            Write-Error "找不到 SSH key: $key"
          }

      - name: 提交
        shell: bash
        run: |
          git config user.name  "kronos-bot"
          git config user.email "kronos-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC 预测更新"
            git push
          else
            echo "无变化"
          fi
